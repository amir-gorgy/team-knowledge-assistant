[project]
name = "team-knowledge-assistant"
version = "0.1.0"
description = "This is a small SaaS where a team connects its docs (PDFs, Repos docs, Markdown) and asks questions; answers cite their resources and say 'not found' rather than guess."
readme = "README.md"
authors = [
    { name = "amir-gorgy", email = "amir.gorgy.98@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "httpx2>=2.16.0",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "uvicorn[standard]>=0.54.0",
]

# [project.scripts]
# team-knowledge-assistant = "team_knowledge_assistant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
